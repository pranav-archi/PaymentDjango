<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
</head>

<body>

    <h1>Payment Page</h1>

    <p>Amount: ₹100</p>

    <a href="{% url 'create_order' %}">
        <button id="pay-btn">Buy Now</button>
    </a>

    {% if order %}
        <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
        <script>
            var options = {
                "key": "{{ razorpay_key_id }}",
                "amount": "{{ order.amount }}",
                "currency": "INR",
                "name": "Physics Notes",
                "description": "Premium Physics Notes",
                "order_id": "{{ order.id }}",

                "handler": function (response) {
                    alert("Payment successful!");
                }
            };

            var razorpay = new Razorpay(options);

            document.getElementById("pay-btn").onclick = function(e) {
                razorpay.open();
                e.preventDefault();
            };
        </script>
    {% endif %}
</body>
</html>
